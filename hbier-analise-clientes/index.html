<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HBier BI</title>

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#02601D" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- iOS: faz o site se comportar como app quando adicionado à tela de início -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HBier BI" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #141412; }

      @media print {
        @page {
          size: A3 landscape;
          margin: 10mm;
        }

        html, body, #root, #root * {
          background: #ffffff !important;
          background-color: #ffffff !important;
          background-image: none !important;
          box-shadow: none !important;
        }
        /* botões (inclui a navegação por abas, toggles e ações) não fazem sentido no papel */
        button, .no-print {
          display: none !important;
        }
        /* tabelas e textos ficam com contorno mais visível no papel, já que perderam o fundo escuro */
        table, th, td {
          border-color: #999 !important;
        }

        /* a tela mostra tabelas largas com scroll horizontal e coluna fixa (sticky) - na
           impressão isso corta informação, já que não tem como "rolar" o papel. Aqui a gente
           deixa tudo se expandir na largura real, sem cortar nada. */
        #root * {
          overflow: visible !important;
          max-width: none !important;
          position: static !important;
        }
        table {
          width: auto !important;
          min-width: 0 !important;
        }
        body {
          font-size: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
